name: V101 temporary LabApi routing
on:
  push:
    branches: [nr-v101-exact-dmrs-additive]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add V101 dispatch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web-server/src/main/kotlin/com/example/nrsimulator/web/LabApi.kt')
          s=p.read_text()
          marker='''        if (version in setOf("V92", "V93", "V94", "V95", "V96", "V97", "V98", "V99", "V100")) {\n            LabApiV92V100.handle(exchange)\n            return\n        }\n'''
          insert=marker+'''        // Additive V101 exact DM-RS dispatch; all V1-V100 routes remain unchanged.\n        if (version == "V101") {\n            NrV101WebAdapter.handle(exchange)\n            return\n        }\n'''
          if marker not in s:
              raise SystemExit('V92-V100 dispatch marker not found')
          p.write_text(s.replace(marker, insert, 1))
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/v101-route.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web-server/src/main/kotlin/com/example/nrsimulator/web/LabApi.kt .github/workflows/v101-route.yml
          git commit -m 'Wire V101 exact DM-RS into LabApi'
          git push
