name: Fix V64 JS runtime errors
on:
  push:
    branches: [main]

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[v64-js-fix]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch JavaScript adapters
        run: |
          python3 - <<'PY'
          from pathlib import Path

          radio = Path('web-server/src/main/resources/static/radio-v64.js')
          text = radio.read_text()
          # A previous bootstrap inserted a literal backslash-n into JavaScript.
          # Convert only that malformed separator into a real newline.
          text = text.replace(";\\nload('/radio-v64-settings.js');", ";\n    load('/radio-v64-settings.js');")
          radio.write_text(text)

          logs = Path('web-server/src/main/resources/static/radio-v64-logs.js')
          text = logs.read_text()
          text = text.replace("    const observer=new MutationObserver(enhance);\n    observer.observe(body,{childList:true,subtree:true});", "    const logBody = $('logBody');\n    const observer=new MutationObserver(enhance);\n    observer.observe(logBody,{childList:true,subtree:true});")
          logs.write_text(text)

          perf = Path('web-server/src/main/resources/static/radio-v64-performance.js')
          text = perf.read_text()
          text = text.replace("  const avg = (us,key) => us.reduce((a,u)=>a+N(u[key]),0)/Math.max(1,us.length);", "  const avg = (us,key) => us.reduce((a,u)=>a+N(typeof key==='function'?key(u):u[key]),0)/Math.max(1,us.length);")
          text = text.replace("      sinr:avg(us,'meanSinrDb'),", "      sinr:avg(us,u=>u.meanSinrDb ?? u.sinrDb),")
          text = text.replace("      bler:pct(avg(us,'meanBler')),", "      bler:pct(avg(us,u=>u.meanBler ?? u.bler)),")
          perf.write_text(text)
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check web-server/src/main/resources/static/radio-v64.js
          node --check web-server/src/main/resources/static/radio-v64-logs.js
          node --check web-server/src/main/resources/static/radio-v64-performance.js

      - name: Remove bootstrap and commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-v64-js-runtime-errors.yml
          git add web-server/src/main/resources/static/radio-v64.js web-server/src/main/resources/static/radio-v64-logs.js web-server/src/main/resources/static/radio-v64-performance.js .github/workflows/fix-v64-js-runtime-errors.yml
          git commit -m '[v64-js-fix] Fix V64 JavaScript runtime errors'
          git push
