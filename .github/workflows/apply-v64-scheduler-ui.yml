name: Apply additive V64 scheduler UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v64-scheduler-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply scheduler presentation layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web-server/src/main/resources/static/radio-v64.js')
          s = p.read_text(encoding='utf-8')
          old = "    load('/radio-v64-mimo-plots.js');"
          new = old + "\n    load('/radio-v64-scheduler.js');"
          if "load('/radio-v64-scheduler.js')" not in s:
              if old not in s:
                  raise SystemExit('radio-v64 dependent-script anchor not found')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          cat > web-server/src/main/resources/static/radio-v64-scheduler.js <<'EOF'
          (()=>{'use strict';
          const $=id=>document.getElementById(id);
          function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}
          function num(v,d=0){const n=Number(v);return Number.isFinite(n)?n:d;}
          function parse(raw){const text=String(raw||'');const m=text.match(/^NrSchedulerV22Result\(grants=\[(.*)\], usedPrbs=([^,]+), fairness=([^,]+), throughputMbps=([^,]+), pass=([^,]+), note=(.*)\)$/s);if(!m)return null;const grants=[];const re=/NrGrantV22\(ueId=([^,]+), prbs=([^,]+), mcs=([^,]+), metric=([^\)]+)\)/g;let g;while((g=re.exec(m[1])))grants.push({ueId:num(g[1]),prbs:num(g[2]),mcs:num(g[3]),metric:num(g[4])});return{grants,usedPrbs:num(m[2]),fairness:num(m[3]),throughput:num(m[4]),pass:String(m[5]).trim().toLowerCase()==='true',note:m[6]};}
          function install(){const target=$('schedulerResult'),btn=$('schedulerRun');if(!target||!btn||btn.dataset.v64Scheduler==='1')return !!target;btn.dataset.v64Scheduler='1';const style=document.createElement('style');style.textContent='.v64-scheduler{font-family:Inter,system-ui,sans-serif;color:#dcecff}.v64-sched-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.v64-sched-kpi{border:1px solid #123554;background:#071c30;border-radius:6px;padding:9px}.v64-sched-kpi span{display:block;color:#7891a8;font-size:9px}.v64-sched-kpi b{display:block;margin-top:4px;font-size:15px}.v64-sched-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:10px}.v64-sched-table th,.v64-sched-table td{padding:7px;border-bottom:1px solid #0d2b45;text-align:right}.v64-sched-table th:first-child,.v64-sched-table td:first-child{text-align:left}.v64-sched-table th{color:#7891a8;background:#071d32}.v64-sched-table td{color:#dcecff}.v64-sched-good{color:#00e994}.v64-sched-note{margin-top:9px;padding:8px;border-left:2px solid #159cff;background:#041522;color:#7891a8;font-size:9px;line-height:1.4}.v64-sched-empty{color:#7891a8;padding:14px 0;font-size:10px}@media(max-width:800px){.v64-sched-kpis{grid-template-columns:repeat(2,1fr)}}';document.head.appendChild(style);
          async function run(){btn.disabled=true;target.innerHTML='<div class="v64-scheduler v64-sched-empty">Running Scheduler Experiment…</div>';try{const p=new URLSearchParams({version:'V22',ue:$('expUe')?.value||8,cqi:$('expCqi')?.value||10,ueSinr:$('expSinr')?.value||15,prbs:$('expPrb')?.value||48});const r=await fetch('/api/lab?'+p.toString(),{cache:'no-store'});const j=await r.json();if(!j.ok)throw Error(j.error||'Scheduler API error');const d=parse(j.result);if(!d)throw Error('Unexpected V22 scheduler result format');const rows=d.grants.map(g=>`<tr><td>UE ${g.ueId}</td><td>${g.prbs}</td><td>${g.mcs}</td><td>${g.metric.toFixed(2)}</td></tr>`).join('');target.innerHTML=`<div class="v64-scheduler"><div class="v64-sched-kpis"><div class="v64-sched-kpi"><span>UEs</span><b>${d.grants.length}</b></div><div class="v64-sched-kpi"><span>Allocated PRBs</span><b>${d.usedPrbs}</b></div><div class="v64-sched-kpi"><span>Fairness</span><b>${d.fairness.toFixed(3)}</b></div><div class="v64-sched-kpi"><span>Throughput</span><b>${d.throughput.toFixed(2)} Mbps</b></div><div class="v64-sched-kpi"><span>Status</span><b class="${d.pass?'v64-sched-good':''}">${d.pass?'PASS':'FAIL'}</b></div></div><table class="v64-sched-table"><thead><tr><th>UE</th><th>PRBs</th><th>MCS</th><th>PF Metric</th></tr></thead><tbody>${rows}</tbody></table>${d.note?`<div class="v64-sched-note">${esc(d.note)}</div>`:''}</div>`;}catch(e){target.innerHTML=`<div class="v64-scheduler v64-sched-empty">${esc(e.message)}</div>`}finally{btn.disabled=false}}btn.onclick=run;return true}
          let n=0;const t=setInterval(()=>{if(install()||++n>100)clearInterval(t)},100);
          })();
          EOF

          rm -f .github/workflows/apply-v64-scheduler-ui.yml

      - name: Commit additive patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-server/src/main/resources/static/radio-v64.js web-server/src/main/resources/static/radio-v64-scheduler.js .github/workflows/apply-v64-scheduler-ui.yml
          git commit -m '[v64-scheduler-ui] Format V22 Scheduler Experiment output' || exit 0
          git push