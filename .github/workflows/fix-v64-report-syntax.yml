name: Fix V64 report syntax

on:
  push:
    paths:
      - '.github/workflows/fix-v64-report-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix nullish expression and self-remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web-server/src/main/resources/static/radio-v64-report.js')
          s = p.read_text()
          old = "['Payload', `${c.payloadBits ?? val('payloadBits') || '128'} bits`],"
          new = "['Payload', `${(c.payloadBits ?? val('payloadBits') ?? '128')} bits`],"
          if old not in s:
              raise SystemExit('target expression not found')
          p.write_text(s.replace(old, new))
          PY
          rm -f .github/workflows/fix-v64-report-syntax.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-server/src/main/resources/static/radio-v64-report.js .github/workflows/fix-v64-report-syntax.yml
          git commit -m '[v64-report] Fix report configuration expression'
          git push
