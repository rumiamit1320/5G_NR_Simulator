name: Restore LDPC embedded tables

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scipy
        run: python3 -m pip install --disable-pip-version-check scipy

      - name: Regenerate embedded tables
        run: python3 tools/embed_nr_ldpc_v85_tables.py

      - name: Verify byte-exact content
        run: |
          echo "59afcf6dd1e61ca1b6b2502a5480d59aad0e6a6d7e76c14f43634194737cb67a  nr-core/src/main/kotlin/com/example/nrsimulator/NrLdpcV85EmbeddedTables.kt" | sha256sum -c -

      - name: Commit and push
        run: |
          git config user.name "rumi amit"
          git config user.email "rumiamit1320@gmail.com"
          git add nr-core/src/main/kotlin/com/example/nrsimulator/NrLdpcV85EmbeddedTables.kt
          git commit -m "Fix nr-core regression suite (part 9 fixup): correct embedded LDPC shift table snapshots (byte-exact)"
          git push
