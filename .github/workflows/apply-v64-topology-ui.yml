name: Apply V64 topology UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch topology script load
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web-server/src/main/resources/static/radio-v64.js')
          s = p.read_text()
          old = "    load('/radio-v64-scheduler.js');"
          new = old + "\n    load('/radio-v64-topology.js');"
          if "load('/radio-v64-topology.js');" not in s:
              if old not in s:
                  raise SystemExit('scheduler script load not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Commit patch and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-server/src/main/resources/static/radio-v64.js .github/workflows/apply-v64-topology-ui.yml
          git rm .github/workflows/apply-v64-topology-ui.yml
          git commit -m '[v64-topology-ui] Wire Network Topology state layer' || exit 0
          git push
