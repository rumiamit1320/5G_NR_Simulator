name: Web Simulator Build

on:
  push:
  pull_request:

jobs:
  build-web-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile web server and reference engine
        run: gradle :web-server:build
      - name: Smoke test application classes
        run: gradle :web-server:classes
      - name: Smoke test HTTP API
        shell: bash
        run: |
          set -o pipefail
          gradle :web-server:run > web-server.log 2>&1 &
          PID=$!
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "===== HTTP smoke-test diagnostics ====="; echo "--- health response ---"; cat /tmp/health.json 2>/dev/null || true; echo "--- simulation response ---"; cat /tmp/sim.json 2>/dev/null || true; echo "--- full-suite response ---"; cat /tmp/suite.json 2>/dev/null || true; echo "--- lab responses ---"; cat /tmp/v19.json 2>/dev/null || true; cat /tmp/v22.json 2>/dev/null || true; cat /tmp/v29.json 2>/dev/null || true; echo "--- web-server.log ---"; cat web-server.log 2>/dev/null || true; fi; kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/health.json
          curl -fsS 'http://127.0.0.1:8080/api/simulate?snr=15&prbs=52&mcs=16&ue=4&tx=4&rx=4&layers=2&mod=64-QAM&scs=30&harq=true' >/tmp/sim.json
          grep -q '"ok":true' /tmp/sim.json
          curl -fsS http://127.0.0.1:8080/api/full-suite >/tmp/suite.json
          grep -q 'V19-V30 regression' /tmp/suite.json
          grep -q 'V32-V45 tests' /tmp/suite.json
          grep -q 'V46-V60 tests' /tmp/suite.json
          curl -fsS 'http://127.0.0.1:8080/api/lab?version=V19&snr=15&prbs=52&layers=2&mcs=16' >/tmp/v19.json
          grep -q '"version":"V19"' /tmp/v19.json
          grep -q '"parameterized":true' /tmp/v19.json
          curl -fsS 'http://127.0.0.1:8080/api/lab?version=V22&snr=12&prbs=40&layers=4&mcs=16&ue=6' >/tmp/v22.json
          grep -q '"version":"V22"' /tmp/v22.json
          curl -fsS 'http://127.0.0.1:8080/api/lab?version=V29&prbs=52&layers=2' >/tmp/v29.json
          grep -q '"version":"V29"' /tmp/v29.json
          curl -fsS http://127.0.0.1:8080/lab.html >/tmp/lab.html
          grep -q '/lab.js' /tmp/lab.html
          echo 'Web API, parameterized V19-V30 lab, and full NR regression smoke tests passed.'
