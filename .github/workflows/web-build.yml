name: Web Simulator Build

on:
  push:
  pull_request:

jobs:
  build-web-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile web server and reference engine
        run: gradle :web-server:build
      - name: Smoke test application classes
        run: gradle :web-server:classes
