name: V101 temporary mapping correction
on:
  push:
    branches: [nr-v101-exact-dmrs-additive]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct exact DM-RS frequency mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nr-core/src/main/kotlin/com/example/nrsimulator/NrDmrsV101.kt')
          s=p.read_text()
          old='''                for (n in 0 until config.resourceBlocks) {\n                    val maxKp = if (config.configurationType == ConfigurationType.TYPE1) 2 else 2\n                    for (kp in 0 until maxKp) {\n                        val k = if (config.configurationType == ConfigurationType.TYPE1) config.startSubcarrier + 12 * n + 4 * (m / 2) + 2 * kp + info.delta else config.startSubcarrier + 12 * n + 6 * (m / 2) + kp + info.delta\n                        if (k >= config.startSubcarrier + 12 * config.resourceBlocks) continue\n                        val value = seq[m.coerceAtMost(seq.lastIndex)]\n'''
          new='''                val nGroups = if (config.configurationType == ConfigurationType.TYPE1) config.resourceBlocks else 2 * config.resourceBlocks\n                for (n in 0 until nGroups) {\n                    for (kp in 0..1) {\n                        val k = if (config.configurationType == ConfigurationType.TYPE1) {\n                            config.startSubcarrier + 12 * n + 2 * kp + info.delta\n                        } else {\n                            config.startSubcarrier + 6 * n + kp + info.delta\n                        }\n                        if (k >= config.startSubcarrier + 12 * config.resourceBlocks) continue\n                        val value = seq[m.coerceAtMost(seq.lastIndex)]\n'''
          if old not in s:
              raise SystemExit('expected V101 mapping block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit correction and remove temporary workflow
        run: |
          rm -f .github/workflows/v101-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nr-core/src/main/kotlin/com/example/nrsimulator/NrDmrsV101.kt .github/workflows/v101-fix.yml
          git commit -m 'Correct V101 DM-RS frequency resource mapping'
          git push
