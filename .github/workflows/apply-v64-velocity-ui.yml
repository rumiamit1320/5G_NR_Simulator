name: Apply V64 velocity UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire velocity adapter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web-server/src/main/resources/static/radio-v64.js')
          s = p.read_text()
          marker = "    load('/radio-v64-topology.js');"
          addition = marker + "\n    load('/radio-v64-velocity.js');"
          if "load('/radio-v64-velocity.js');" not in s:
              if marker not in s:
                  raise SystemExit('topology script load not found')
              p.write_text(s.replace(marker, addition, 1))
          PY
      - name: Commit patch and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-server/src/main/resources/static/radio-v64.js .github/workflows/apply-v64-velocity-ui.yml
          git rm .github/workflows/apply-v64-velocity-ui.yml
          git commit -m '[v64-velocity-ui] Wire UE velocity control' || exit 0
          git push
