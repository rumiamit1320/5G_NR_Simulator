name: Apply V64 HMI runtime fix
on:
  push:
    paths:
      - '.github/workflows/apply-v64-hmi-runtime-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V64 controller and report
        shell: python
        run: |
          from pathlib import Path
          p = Path('web-server/src/main/resources/static/radio-v64-fixed.js')
          s = p.read_text(encoding='utf-8')
          old = "function sync(){[['slots','slotsOut',''],['ue','ueOut',''],['cells','cellsOut',''],['prbs','prbsOut',''],['scs','scsOut',' kHz'],['velocity','velocityOut',' km/h']].forEach(([a,b,s])=>$(b).textContent=$(a).value+s);$('legendCells').textContent=$('cells').value;$('legendUes').textContent=$('ue').value;$('legendPrbs').textContent=$('prbs').value;$('legendScs').textContent=$('scs').value+' kHz';$('legendVelocity').textContent=$('velocity').value+' km/h')}"
          new = "function sync(){[['slots','slotsOut',''],['ue','ueOut',''],['cells','cellsOut',''],['prbs','prbsOut',''],['scs','scsOut',' kHz'],['velocity','velocityOut',' km/h']].forEach(([a,b,s])=>{const src=$(a),dst=$(b);if(src&&dst)dst.textContent=src.value+s});const set=(id,v)=>{const e=$(id);if(e)e.textContent=v};const get=id=>$(id)?.value??'';set('legendCells',get('cells'));set('legendUes',get('ue'));set('legendPrbs',get('prbs'));set('legendScs',get('scs')+' kHz');set('legendVelocity',get('velocity')+' km/h')}"
          if old not in s:
              raise SystemExit('sync target not found')
          p.write_text(s.replace(old,new),encoding='utf-8')

          r = Path('web-server/src/main/resources/static/radio-v64-report.js')
          report = r'''// V64 additive PDF report layer.
// Modern engineering-style report presentation; V61/V62/V63/V64 engines are unchanged.
(()=>{
  'use strict';
  const $=id=>document.getElementById(id);
  const num=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'—';
  const pct=v=>Number.isFinite(Number(v))?(Number(v)*100).toFixed(2)+'%':'—';
  function load(done){if(window.jspdf?.jsPDF)return done();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js';s.onload=done;s.onerror=()=>alert('PDF library could not be loaded. Check the network connection and try again.');document.head.appendChild(s)}
  function header(doc,title,id){doc.setFillColor(8,18,32);doc.rect(0,0,210,15,'F');doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont(undefined,'bold');doc.text('5G NR SIMULATOR',14,9);doc.setFont(undefined,'normal');doc.text('V64 RADIO ENVIRONMENT LAB',196,9,{align:'right'});doc.setTextColor(20,30,40);doc.setFontSize(7);doc.text(title.toUpperCase(),14,22);doc.setTextColor(100,110,120);doc.text('Report ID: '+id,196,22,{align:'right'})}
  function footer(doc,id){const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setDrawColor(190,198,208);doc.line(14,285,196,285);doc.setTextColor(100,110,120);doc.setFontSize(7);doc.text('5G NR SIMULATOR • V64',14,290);doc.text('Report ID: '+id,105,290,{align:'center'});doc.text('Page '+i+' / '+n,196,290,{align:'right'})}}
  function text(doc,t,x,y,w){const lines=doc.splitTextToSize(String(t||'—'),w);for(const line of lines){if(y>276){doc.addPage();header(doc,'Continuation',doc.__rid);y=31}doc.text(line,x,y);y+=5}return y}
  function title(doc,t,y){if(y>258){doc.addPage();header(doc,t,doc.__rid);y=31}doc.setTextColor(15,35,55);doc.setFontSize(12);doc.setFont(undefined,'bold');doc.text(t,14,y);doc.setDrawColor(55,115,160);doc.line(14,y+3,196,y+3);doc.setFont(undefined,'normal');doc.setFontSize(8);return y+10}
  function table(doc,data,y){const us=data?.ueStates||[];y=title(doc,'Per-UE Radio / PHY Results',y);const h=['UE','SINR dB','CQI','MCS','PRBs','Throughput Mbps','BLER','CRC'],x=[14,30,50,66,82,101,142,165];doc.setFillColor(226,234,240);doc.rect(13,y-5,184,8,'F');doc.setFont(undefined,'bold');doc.setFontSize(7);h.forEach((v,i)=>doc.text(v,x[i],y));doc.setFont(undefined,'normal');y+=7;us.forEach((u,i)=>{if(y>274){doc.addPage();header(doc,'Per-UE Results',doc.__rid);y=31;doc.setFillColor(226,234,240);doc.rect(13,y-5,184,8,'F');doc.setFont(undefined,'bold');h.forEach((v,j)=>doc.text(v,x[j],y));doc.setFont(undefined,'normal');y+=7}if(i%2===0){doc.setFillColor(247,249,251);doc.rect(13,y-4,184,6,'F')}const row=[u.ueId,num(u.sinrDb??u.meanSinrDb),u.cqi??u.meanCqi??'—',u.mcs??u.meanMcs??'—',u.allocatedPrbs??u.totalAllocatedPrbs??'—',num(u.throughputMbps),u.bler==null&&u.meanBler==null?'—':num((u.bler??u.meanBler)*100,3)+'%',u.phyCrcPassRate==null?'—':pct(u.phyCrcPassRate)];row.forEach((v,j)=>doc.text(String(v).slice(0,16),x[j],y));y+=6});return y+5}
  function block(doc,name,id,y){const e=$(id);if(!e)return y;const t=String(e.textContent||e.value||'').replace(/\s+/g,' ').trim();if(!t||t==='—'||t==='Running…')return y;y=title(doc,name,y);return text(doc,t,14,y,182)+5}
  function make(){load(()=>{const jsPDF=window.jspdf.jsPDF,now=new Date(),rid='V64-'+now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'-'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0')+String(now.getSeconds()).padStart(2,'0'),stamp=now.toISOString().replace(/[:.]/g,'-'),data=window.__v64LastData||{},m=data.metrics||{},c=data.config||{},doc=new jsPDF({unit:'mm',format:'a4'});doc.__rid=rid;doc.setProperties({title:'5G NR Simulator — V64 Simulation Report '+rid,subject:'V64 Radio Environment and Closed-Loop Simulation Results',author:'5G NR Simulator V64 HMI',creator:'5G NR Simulator'});doc.setFillColor(7,17,30);doc.rect(0,0,210,297,'F');doc.setTextColor(255,255,255);doc.setFont(undefined,'bold');doc.setFontSize(11);doc.text('5G NR SIMULATOR',28,35);doc.setFontSize(25);doc.text('V64 RADIO ENVIRONMENT',28,58);doc.text('SIMULATION REPORT',28,70);doc.setFont(undefined,'normal');doc.setFontSize(10);doc.setTextColor(190,205,218);doc.text('Engineering analysis and simulation results',28,82);doc.setFillColor(15,30,47);doc.roundedRect(28,112,154,72,3,3,'F');doc.setTextColor(130,190,220);doc.setFontSize(8);doc.setFont(undefined,'bold');doc.text('DOCUMENT CONTROL',38,126);doc.setFont(undefined,'normal');doc.setFontSize(9);[['Report ID',rid],['Generated by','5G NR Simulator V64 HMI'],['Generated on',now.toLocaleString()],['Application','5G_NR_Simulator'],['Simulation mode','Real-Time Closed Loop']].forEach((r,i)=>{const yy=139+i*8;doc.setTextColor(150,165,178);doc.text(r[0],38,yy);doc.setTextColor(240,245,248);doc.text(String(r[1]),82,yy)});doc.setTextColor(140,155,168);doc.setFontSize(7);doc.text('Generated from the current V64 HMI state.',28,264);doc.text('V61 PHY + V62 Radio Environment + V63 Integration + V64 Closed Loop',28,274);
      doc.addPage();header(doc,'Executive Summary',rid);let y=32;y=title(doc,'Executive Summary',y);y=text(doc,'This report records the current V64 real-time closed-loop simulation state, including radio environment conditions, PHY performance, scheduler behavior and per-UE results. It is an engineering simulation artifact, not a 3GPP conformance report.',14,y,182)+7;y=title(doc,'Key Performance Indicators',y);[['Total Throughput',m.totalThroughputMbps==null?'—':num(m.totalThroughputMbps,3)+' Mbps'],['System Fairness',m.systemFairness==null?'—':num(m.systemFairness,5)],['PHY CRC Pass Rate',pct(m.phyCrcPassRate)],['PHY BER',m.phyBer==null?'—':Number(m.phyBer).toExponential(4)]].forEach((q,i)=>{const x=14+i*45.5;doc.setFillColor(242,246,249);doc.roundedRect(x,y,42,25,2,2,'F');doc.setTextColor(80,95,108);doc.setFontSize(6.5);doc.setFont(undefined,'bold');doc.text(q[0].toUpperCase(),x+3,y+7);doc.setTextColor(15,40,60);doc.setFontSize(9);doc.text(String(q[1]),x+3,y+17)});y+=34;y=title(doc,'Simulation Configuration',y);const cfg=[['Cells',c.cells??'—'],['UE count',c.ueCount??c.ue??'—'],['PRBs / cell',c.prbs??'—'],['SCS',(c.scs??'—')+' kHz'],['UE velocity',(c.velocityKmh??c.velocity??'—')+' km/h'],['Simulation slots',c.slots??'—'],['Payload',(c.payloadBits??128)+' bits'],['TX / RX',(c.tx??4)+' / '+(c.rx??4)],['Layers',c.layers??1],['Mode','V64 closed loop']];cfg.forEach((q,i)=>{const col=i%2,row=Math.floor(i/2),x=16+col*92,yy=y+row*8;doc.setFont(undefined,'bold');doc.text(q[0],x,yy);doc.setFont(undefined,'normal');doc.text(String(q[1]),x+35,yy)});y+=Math.ceil(cfg.length/2)*8+5;y=table(doc,data,y);y=block(doc,'PHY Pipeline Result','phyResult',y);y=block(doc,'MIMO / CSI Result','mimoResult',y);y=block(doc,'Scheduler Experiment Result','schedulerResult',y);y=block(doc,'Parameter Sweep Result','sweepResult',y);const hist=window.__v64Performance?.history||[];doc.addPage();header(doc,'Performance History',rid);y=32;y=title(doc,'Live Performance History',y);y=text(doc,'Numerical history retained by the live Radio Performance layer: '+hist.length+' samples.',14,y,182)+4;if(hist.length){doc.setFont(undefined,'bold');doc.setFontSize(7);doc.text('Sample',14,y);doc.text('Throughput Mbps',42,y);doc.text('Avg SINR dB',88,y);doc.text('Avg BLER %',126,y);doc.text('PRB Util %',162,y);doc.setFont(undefined,'normal');y+=7;hist.forEach((s,i)=>{if(y>274){doc.addPage();header(doc,'Performance History',rid);y=31}doc.text(String(i+1),14,y);doc.text(num(s.throughput,2),42,y);doc.text(num(s.sinr,2),88,y);doc.text(num(s.bler,2),126,y);doc.text(num(s.prb,2),162,y);y+=6})}footer(doc,rid);doc.save('5G_NR_V64_Report_'+stamp+'.pdf')})}
  function install(){const a=document.createElement('button');a.id='v64ReportButton';a.type='button';a.textContent='▣ Download Report';a.title='Generate modern engineering PDF report';a.style.cssText='cursor:pointer';a.onclick=make;const host=document.querySelector('.actions');if(host&&!document.getElementById('v64ReportButton'))host.appendChild(a)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();
})();
'''
          r.write_text(report,encoding='utf-8')
      - name: Validate JavaScript
        run: |
          node --check web-server/src/main/resources/static/radio-v64-fixed.js
          node --check web-server/src/main/resources/static/radio-v64-performance.js
          node --check web-server/src/main/resources/static/radio-v64-report.js
      - name: Commit and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-server/src/main/resources/static/radio-v64-fixed.js web-server/src/main/resources/static/radio-v64-report.js
          git commit -m "[v64-hmi-fix] Repair V64 HMI runtime and report syntax"
          git push
          git rm .github/workflows/apply-v64-hmi-runtime-fix.yml
          git commit -m "[v64-hmi-fix] Remove bootstrap workflow"
          git push
