name: Apply V64 no-autostart repair
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch V64 fixed controller
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web-server/src/main/resources/static/radio-v64-fixed.js')
          s=p.read_text()
          s=s.replace('running:false,live:true,timer:null', 'running:false,live:false,timer:null')
          old="function sync(){[['slots','slotsOut',''],['ue','ueOut',''],['cells','cellsOut',''],['prbs','prbsOut',''],['scs','scsOut',' kHz'],['velocity','velocityOut',' km/h']].forEach(([a,b,s])=>$(b).textContent=$(a).value+s);$('legendCells').textContent=$('cells').value;$('legendUes').textContent=$('ue').value;$('legendPrbs').textContent=$('prbs').value;$('legendScs').textContent=$('scs').value+' kHz';$('legendVelocity').textContent=$('velocity').value+' km/h'}"
          new="function sync(){[['slots','slotsOut',''],['ue','ueOut',''],['cells','cellsOut',''],['prbs','prbsOut',''],['scs','scsOut',' kHz'],['velocity','velocityOut',' km/h']].forEach(([a,b,s])=>{const src=$(a),dst=$(b);if(src&&dst)dst.textContent=src.value+s});const set=(id,v)=>{const e=$(id);if(e)e.textContent=v};const val=id=>$(id)?.value??'';set('legendCells',val('cells'));set('legendUes',val('ue'));set('legendPrbs',val('prbs'));set('legendScs',val('scs')+' kHz');set('legendVelocity',val('velocity')+' km/h')}"
          if old not in s:
            raise SystemExit('expected sync function not found')
          s=s.replace(old,new)
          oldbars="function bars(id,a,s=''){const e=$(id);if(!e)return;const v=a.map(N),m=Math.max(...v,1);e.innerHTML=v.map((x,i)=>`<div class=\"bar-col\"><i style=\"height:${Math.max(3,100*x/m)}%\"></i><small>UE${i+1}</small></div>`).join('')}"
          newbars="function bars(id,a,s=''){const e=$(id);if(!e||id.startsWith('perf'))return;const v=a.map(N),m=Math.max(...v,1);e.innerHTML=v.map((x,i)=>`<div class=\"bar-col\"><i style=\"height:${Math.max(3,100*x/m)}%\"></i><small>UE${i+1}</small></div>`).join('')}"
          if oldbars not in s:
            raise SystemExit('expected bars function not found')
          s=s.replace(oldbars,newbars)
          s=s.replace("sync();logs();log('V64 HMI initialized');run();setInterval", "sync();logs();log('V64 HMI initialized');$('topStatus').innerHTML='<i></i>READY';$('liveToggle').textContent='▶ Live: OFF';setInterval")
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: node --check web-server/src/main/resources/static/radio-v64-fixed.js
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-server/src/main/resources/static/radio-v64-fixed.js
          git commit -m '[v64-hmi-fix] Stop simulation auto-start and chart rebuilds' || true
          git rm .github/workflows/apply-v64-no-autostart.yml
          git commit -m '[v64-hmi-fix] Remove repair workflow' || true
          git push