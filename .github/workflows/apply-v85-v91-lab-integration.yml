name: Apply V85-V91 Lab Integration

on:
  push:
    branches:
      - nr-v85-v91-additive

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply surgical LabApi integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web-server/src/main/kotlin/com/example/nrsimulator/web/LabApi.kt')
          text = path.read_text(encoding='utf-8')

          anchor = '        val version = q(exchange, "version", "V19").uppercase()\n'
          insertion = '''        val version = q(exchange, "version", "V19").uppercase()\n        // Additive V85-V91 dispatch: preserve the existing V19-V63 LabApi path unchanged.\n        if (version in setOf("V85", "V86", "V87", "V88", "V89", "V90", "V91")) {\n            NrV85V91WebAdapter.handle(exchange)\n            return\n        }\n'''

          if text.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one LabApi version anchor, found {text.count(anchor)}')
          if 'NrV85V91WebAdapter.handle(exchange)' in text:
              raise SystemExit('V85-V91 LabApi dispatch already present')

          path.write_text(text.replace(anchor, insertion, 1), encoding='utf-8')
          print('Applied additive V85-V91 /api/lab dispatch')
          PY

      - name: Verify surgical change
        run: |
          grep -F 'NrV85V91WebAdapter.handle(exchange)' web-server/src/main/kotlin/com/example/nrsimulator/web/LabApi.kt
          grep -F 'version in setOf("V85", "V86", "V87", "V88", "V89", "V90", "V91")' web-server/src/main/kotlin/com/example/nrsimulator/web/LabApi.kt

      - name: Commit source change and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-v85-v91-lab-integration.yml
          git add web-server/src/main/kotlin/com/example/nrsimulator/web/LabApi.kt
          git commit -m 'Integrate V85-V91 into web lab API'
          git push origin HEAD:${GITHUB_REF_NAME}
