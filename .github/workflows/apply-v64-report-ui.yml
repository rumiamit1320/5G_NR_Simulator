name: Apply V64 report UI wiring
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[v64-report] Bootstrap report-button wiring')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire report adapter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web-server/src/main/resources/static/radio-v64.js')
          s=p.read_text()
          marker="    load('/radio-v64-velocity.js');"
          line="    load('/radio-v64-report.js');"
          if line not in s:
              if marker not in s:
                  raise SystemExit('velocity loader marker not found')
              s=s.replace(marker, marker+'\n'+line, 1)
              p.write_text(s)
          w=Path('.github/workflows/apply-v64-report-ui.yml')
          w.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-server/src/main/resources/static/radio-v64.js .github/workflows/apply-v64-report-ui.yml
          git commit -m '[v64-report] Wire downloadable PDF report'
          git push
