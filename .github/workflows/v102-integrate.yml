name: V102-V110 additive integration
on:
  push:
    branches: [nr-v102-v110-additive]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Wire V102-V110 routes and regression gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web-server/src/main/kotlin/com/example/nrsimulator/web/LabApi.kt')
          s=p.read_text()
          marker='        val snr = q(exchange, "snr", "15").toDoubleOrNull()?.coerceIn(-20.0, 50.0) ?: 15.0'
          route='''        // Additive V102-V110 dispatch; all V1-V101 routes remain unchanged.\n        if (version in setOf("V102", "V103", "V104", "V105", "V106", "V107", "V108", "V109", "V110")) {\n            NrV102V110WebAdapter.handle(exchange)\n            return\n        }\n'''
          if 'NrV102V110WebAdapter.handle(exchange)' not in s:
              if marker not in s: raise SystemExit('LabApi insertion marker not found')
              s=s.replace(marker,route+marker,1)
              p.write_text(s)

          p=Path('nr-core/src/main/kotlin/com/example/nrsimulator/CoreRegressionMain.kt')
          s=p.read_text()
          line='    runCatching { check("V102-V110 tests", NrV102V110Tests.run().passed) }.onFailure { check("V102-V110 tests", false) }\n'
          marker='    runCatching { check("V101 exact DM-RS tests", NrDmrsV101Tests.run().passed) }.onFailure { check("V101 exact DM-RS tests", false) }\n'
          if 'V102-V110 tests' not in s:
              if marker not in s: raise SystemExit('CoreRegression marker not found')
              s=s.replace(marker,marker+line,1)
              p.write_text(s)

          p=Path('nr-core/src/main/kotlin/com/example/nrsimulator/NrCanonicalPhy.kt')
          s=p.read_text()
          marker='        "exact PDSCH/PUSCH DMRS sequence+mapping -> NrDmrsV101",\n'
          line='        "RE reservation/OFDM/MIMO/channel/soft LLR -> NrV102V110Additive",\n'
          if '-> NrV102V110Additive' not in s:
              if marker not in s: raise SystemExit('Canonical marker not found')
              s=s.replace(marker,marker+line,1)
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/v102-integrate.yml
          git add .
          git commit -m "Wire V102-V110 into existing LabApi and regression" || exit 0
          git push
